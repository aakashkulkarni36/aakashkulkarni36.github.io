<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Aakash Kulkarni</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF7F2">
<style>
  :root{
    --canvas:#FAF7F2; --ink:#16161A; --ink2:#6B6560; --line:#D9D2C7; --accent:#B5432A;
    --serif:"New York","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;background:var(--canvas);color:var(--ink);font-family:var(--sans);background-image:radial-gradient(900px 500px at 80% -10%, rgba(181,67,42,.08), transparent 60%)}
  main{max-width:640px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
  h1{font-family:var(--serif);font-size:clamp(48px,9vw,96px);line-height:.95;letter-spacing:-3px;margin:0 0 18px}
  p{color:var(--ink2);font-size:17px;line-height:1.6;margin:0 0 22px;max-width:46ch}
  a{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;border-radius:999px;padding:12px 18px;font-size:14px;font-weight:600}
  a:hover{filter:brightness(1.04)}
  .rule{height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin:0 0 22px;max-width:220px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">404 · Not found</p>
  <h1>This page doesn’t exist.</h1>
  <div class="rule"></div>
  <p>Maybe it was a bad link, or maybe I moved it. Either way, the work is still one click away.</p>
  <a href="/">Go home <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
